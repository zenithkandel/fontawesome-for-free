<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FontAwesome Icon Tester</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/fontawesome.css" />
    <link rel="stylesheet" href="css/solid.css" />
    <link rel="stylesheet" href="css/regular.css" />
    <link rel="stylesheet" href="css/light.css" />
    <link rel="stylesheet" href="css/thin.css" />
    <link rel="stylesheet" href="css/brands.css" />
    <link rel="stylesheet" href="css/sharp-solid.css" />
    <link rel="stylesheet" href="css/sharp-regular.css" />
    <link rel="stylesheet" href="css/sharp-light.css" />
    <link rel="stylesheet" href="css/sharp-thin.css" />
    <link rel="stylesheet" href="css/duotone.css" />
    <link rel="stylesheet" href="css/duotone-regular.css" />
    <link rel="stylesheet" href="css/duotone-light.css" />
    <link rel="stylesheet" href="css/duotone-thin.css" />
    <link rel="stylesheet" href="css/sharp-duotone-solid.css" />
    <link rel="stylesheet" href="css/sharp-duotone-regular.css" />
    <link rel="stylesheet" href="css/sharp-duotone-light.css" />
    <link rel="stylesheet" href="css/sharp-duotone-thin.css" />
    <link rel="stylesheet" href="css/chisel-regular.css" />
    <link rel="stylesheet" href="css/etch-solid.css" />
    <link rel="stylesheet" href="css/graphite-thin.css" />
    <link rel="stylesheet" href="css/jelly-regular.css" />
    <link rel="stylesheet" href="css/jelly-duo-regular.css" />
    <link rel="stylesheet" href="css/jelly-fill-regular.css" />
    <link rel="stylesheet" href="css/notdog-solid.css" />
    <link rel="stylesheet" href="css/notdog-duo-solid.css" />
    <link rel="stylesheet" href="css/slab-regular.css" />
    <link rel="stylesheet" href="css/slab-press-regular.css" />
    <link rel="stylesheet" href="css/thumbprint-light.css" />
    <link rel="stylesheet" href="css/utility-semibold.css" />
    <link rel="stylesheet" href="css/utility-duo-semibold.css" />
    <link rel="stylesheet" href="css/utility-fill-semibold.css" />
    <link rel="stylesheet" href="css/whiteboard-semibold.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header>
      <div class="logo">FA <em>TESTER</em></div>
      <div class="swrap">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" id="search" placeholder="Search icons..." />
      </div>
      <div class="hst">
        <div class="stat">
          <div class="dot ok"></div>
          <strong id="tok">-</strong> rendering
        </div>
        <div class="stat">
          <div class="dot fail"></div>
          <strong id="tfail">-</strong> broken
        </div>
      </div>
    </header>

    <div id="fbanner">
      <div class="fbrow">
        <div class="pulse"></div>
        <span id="fbmsg">Waiting for webfonts...</span>
      </div>
      <div class="ftags" id="ftags"></div>
    </div>

    <div class="tbar" id="tbar">
      <button class="tab act" data-s="__all__">
        ALL <span class="n" id="cnt-all">-</span>
      </button>
    </div>

    <main>
      <div id="loading">
        <div class="spin"></div>
        <div id="lmsg">Fetching CSS...</div>
      </div>
      <div id="analysis">
        <div class="ahead">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
          </svg>
          Render Audit - all style-sheets
        </div>
        <div class="agrid" id="agrid"></div>
      </div>
      <div id="allres"></div>
      <div id="secwrap"></div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
