    <style>
      :root {
        --bg: #07080d;
        --bg2: #0e1018;
        --bg3: #161923;
        --border: #1e2535;
        --border2: #2a3348;
        --text: #c8d0e0;
        --dim: #5a6680;
        --bright: #eef1f8;
        --accent: #4df0c5;
        --ok: #3dffa0;
        --fail: #ff4d6d;
        --warn: #ffd166;
        --mono: "JetBrains Mono", monospace;
        --display: "Syne", sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(7, 8, 13, 0.95);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 54px;
        flex-wrap: nowrap;
      }
      .logo {
        font-family: var(--display);
        font-weight: 800;
        font-size: 15px;
        color: var(--bright);
        white-space: nowrap;
      }
      .logo em {
        color: var(--accent);
        font-style: normal;
      }
      .swrap {
        flex: 1;
        max-width: 320px;
        position: relative;
        min-width: 0;
      }
      .swrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--dim);
        flex-shrink: 0;
      }
      #search {
        width: 100%;
        background: var(--bg3);
        border: 1px solid var(--border2);
        border-radius: 8px;
        color: var(--bright);
        font-family: var(--mono);
        font-size: 12px;
        padding: 7px 12px 7px 30px;
        outline: none;
        transition: border-color 0.2s;
      }
      #search:focus {
        border-color: var(--accent);
      }
      #search::placeholder {
        color: var(--dim);
      }
      .hst {
        margin-left: auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-shrink: 0;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--dim);
      }
      .stat strong {
        color: var(--bright);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ok {
        background: var(--ok);
        box-shadow: 0 0 5px var(--ok);
      }
      .dot.fail {
        background: var(--fail);
        box-shadow: 0 0 5px var(--fail);
      }
      .dot.warn {
        background: var(--warn);
        box-shadow: 0 0 5px var(--warn);
      }

      /* Font banner */
      #fbanner {
        border-bottom: 1px solid rgba(255, 209, 102, 0.2);
        padding: 8px 22px;
        font-size: 11px;
        color: var(--warn);
        background: rgba(255, 209, 102, 0.04);
      }
      #fbanner.ok {
        color: var(--ok);
        border-color: rgba(61, 255, 160, 0.15);
        background: rgba(61, 255, 160, 0.03);
      }
      .fbrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1s ease-in-out infinite;
        flex-shrink: 0;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
      .ftags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ftag {
        padding: 1px 7px;
        border-radius: 4px;
        font-size: 10px;
        border: 1px solid var(--border);
        color: var(--dim);
        background: var(--bg3);
      }
      .ftag.ok {
        color: var(--ok);
        border-color: rgba(61, 255, 160, 0.3);
      }
      .ftag.fail {
        color: var(--fail);
        border-color: rgba(255, 77, 109, 0.3);
      }

      /* Tabs */
      .tbar {
        position: sticky;
        top: 54px;
        z-index: 90;
        background: rgba(7, 8, 13, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 22px;
        display: flex;
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }
      .tab {
        flex-shrink: 0;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--dim);
        font-family: var(--mono);
        font-size: 11px;
        padding: 10px 12px;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.act {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab .n {
        display: inline-block;
        background: var(--bg3);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 9px;
        margin-left: 4px;
        color: var(--dim);
      }
      .tab.act .n {
        color: var(--accent);
        background: rgba(77, 240, 197, 0.1);
      }

      /* Layout */
      main {
        padding: 22px;
        position: relative;
        z-index: 1;
      }
      .sec {
        display: none;
      }
      .sec.vis {
        display: block;
      }

      /* Debug box */
      .debugbox {
        background: var(--bg2);
        border: 1px solid rgba(255, 209, 102, 0.25);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .dbhead {
        background: rgba(255, 209, 102, 0.07);
        border-bottom: 1px solid rgba(255, 209, 102, 0.15);
        padding: 8px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--warn);
        cursor: pointer;
        user-select: none;
      }
      .dbhead:hover {
        background: rgba(255, 209, 102, 0.12);
      }
      .dbpre {
        padding: 12px 14px;
        font-size: 10px;
        color: var(--dim);
        line-height: 1.6;
        overflow-x: auto;
        white-space: pre;
        max-height: 160px;
        overflow-y: auto;
        display: none;
      }
      .dbpre.open {
        display: block;
      }

      /* Analysis */
      #analysis {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 22px;
        display: none;
      }
      .ahead {
        background: var(--bg3);
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 13px;
        color: var(--bright);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .agrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
      .arow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        gap: 8px;
        min-width: 0;
      }
      .aname {
        font-size: 11px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .afmt {
        font-size: 9px;
        color: var(--dim);
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 5px;
        flex-shrink: 0;
      }
      .apills {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        align-items: center;
      }
      .badge {
        padding: 1px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge.ok {
        background: rgba(61, 255, 160, 0.1);
        color: var(--ok);
        border-color: rgba(61, 255, 160, 0.25);
      }
      .badge.fail {
        background: rgba(255, 77, 109, 0.1);
        color: var(--fail);
        border-color: rgba(255, 77, 109, 0.25);
      }
      .badge.warn {
        background: rgba(255, 209, 102, 0.1);
        color: var(--warn);
        border-color: rgba(255, 209, 102, 0.25);
      }

      /* Section header */
      .shead {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      .stitle {
        font-family: var(--display);
        font-weight: 700;
        font-size: 17px;
        color: var(--bright);
      }
      .sfile {
        font-size: 10px;
        color: var(--dim);
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 7px;
      }
      .sfmt {
        font-size: 10px;
        color: var(--accent);
        background: rgba(77, 240, 197, 0.08);
        border: 1px solid rgba(77, 240, 197, 0.2);
        border-radius: 4px;
        padding: 1px 7px;
      }
      .ssum {
        margin-left: auto;
        display: flex;
        gap: 5px;
        align-items: center;
      }

      /* Icon grid */
      .igrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 5px;
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 5px 7px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
        position: relative;
        overflow: hidden;
      }
      .card:hover {
        background: var(--bg3);
        border-color: var(--border2);
        transform: translateY(-1px);
      }
      .card.broken {
        border-color: rgba(255, 77, 109, 0.2);
        background: rgba(255, 77, 109, 0.04);
      }
      .pip {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ok);
      }
      .card.broken .pip {
        background: var(--fail);
      }
      .prev {
        font-size: 22px;
        line-height: 1;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--bright);
        transition: color 0.15s;
      }
      .card:hover .prev {
        color: var(--accent);
      }
      .card.broken .prev {
        color: var(--fail);
        opacity: 0.4;
      }
      .iname {
        font-size: 9px;
        color: var(--dim);
        text-align: center;
        word-break: break-all;
        line-height: 1.3;
        max-width: 78px;
      }
      .card::after {
        content: "copied!";
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: #000;
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 3px;
        transition: bottom 0.18s;
        pointer-events: none;
      }
      .card.done::after {
        bottom: 5px;
      }

      /* Loading */
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 55vh;
        gap: 14px;
      }
      .spin {
        width: 32px;
        height: 32px;
        border: 2px solid var(--border2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #lmsg {
        color: var(--dim);
        font-size: 12px;
      }

      /* Search */
      #allres {
        display: none;
      }
      #allres.vis {
        display: block;
      }
      .grplbl {
        font-family: var(--display);
        font-weight: 700;
        font-size: 13px;
        color: var(--dim);
        margin: 20px 0 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grplbl::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
        color: var(--dim);
        font-size: 12px;
        flex-direction: column;
        gap: 6px;
      }
      .errc {
        background: rgba(255, 77, 109, 0.07);
        border: 1px solid rgba(255, 77, 109, 0.2);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--fail);
        font-size: 11px;
        margin-bottom: 14px;
        line-height: 1.8;
      }
      mark {
        background: rgba(77, 240, 197, 0.18);
        color: var(--accent);
        border-radius: 2px;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">FA <em>TESTER</em></div>
      <div class="swrap">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" id="search" placeholder="Search icons…" />
      </div>
      <div class="hst">
        <div class="stat">
          <div class="dot ok"></div>
          <strong id="tok">–</strong> rendering
        </div>
        <div class="stat">
          <div class="dot fail"></div>
          <strong id="tfail">–</strong> broken
        </div>
      </div>
    </header>

    <div id="fbanner">
      <div class="fbrow">
        <div class="pulse"></div>
        <span id="fbmsg">Waiting for webfonts…</span>
      </div>
      <div class="ftags" id="ftags"></div>
    </div>

    <div class="tbar" id="tbar">
      <button class="tab act" data-s="__all__">
        ALL <span class="n" id="cnt-all">–</span>
      </button>
    </div>

    <main>
      <div id="loading">
        <div class="spin"></div>
        <div id="lmsg">Fetching CSS…</div>
      </div>
      <div id="analysis">
        <div class="ahead">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
          </svg>
          Render Audit — all style-sheets
        </div>
        <div class="agrid" id="agrid"></div>
      </div>
      <div id="allres"></div>
      <div id="secwrap"></div>
    </main>

          file: "css/thumbprint-light.css",
          label: "Thumbprint Light",
          style: "fa-thumbprint fa-light",
        },
        {
          id: "utility-semibold",
          file: "css/utility-semibold.css",
          label: "Utility Semibold",
          style: "fa-utility",
        },
        {
          id: "utility-duo-semibold",
          file: "css/utility-duo-semibold.css",
          label: "Utility Duo Semibold",
          style: "fa-utility-duo",
        },
        {
          id: "utility-fill-semibold",
          file: "css/utility-fill-semibold.css",
          label: "Utility Fill Semibold",
          style: "fa-utility-fill",
        },
        {
          id: "whiteboard-semibold",
          file: "css/whiteboard-semibold.css",
          label: "Whiteboard Semibold",
          style: "fa-whiteboard",
        },
      ];

      // ─── MULTI-FORMAT CSS PARSER ─────────────────────────────────────────────────
      /*
  FA CSS has evolved through several formats. We try all of them:

  FORMAT A — Classic FA4/5:
    .fa-house:before { content: "\f015"; }

  FORMAT B — FA6 standard:
    .fa-house::before { content: "\f015"; }

  FORMAT C — FA6 Kit / Pro (custom property per icon):
    .fa-house { --fa: "\f015"; }
    (plus a shared ::before { content: var(--fa,""); } on the style class)

  FORMAT D — FA6 Kit v2 (--fa-icon custom property):
    .fa-house { --fa-icon: "\f015"; }

  FORMAT E — Ligature / content on element (rare kits):
    .fa-house[data-icon]::before { content: attr(data-icon); }
*/
      function parseCss(css) {
        const icons = [],
          seen = new Set();

        function add(cls) {
          // Only real icon classes: fa-<something> but not fa-solid, fa-regular etc (style classes)
          const STYLE_CLASSES = new Set([
            "fa-solid",
            "fa-regular",
            "fa-light",
            "fa-thin",
            "fa-brands",
            "fa-duotone",
            "fa-sharp",
            "fa-sharp-duotone",
            "fa-classic",
            "fa-kit",
            "fa-pro",
            "fa-fw",
            "fa-lg",
            "fa-sm",
            "fa-xs",
            "fa-2xs",
            "fa-xl",
            "fa-2xl",
            "fa-1x",
            "fa-2x",
            "fa-3x",
            "fa-4x",
            "fa-5x",
            "fa-6x",
            "fa-7x",
            "fa-8x",
            "fa-9x",
            "fa-10x",
            "fa-spin",
            "fa-spin-reverse",
            "fa-spin-pulse",
            "fa-pulse",
            "fa-beat",
            "fa-fade",
            "fa-bounce",
            "fa-shake",
            "fa-flip",
            "fa-beat-fade",
            "fa-fixedWidth",
            "fa-fixed-width",
            "fa-ul",
            "fa-li",
            "fa-border",
            "fa-pull-left",
            "fa-pull-right",
            "fa-stack",
            "fa-stack-1x",
            "fa-stack-2x",
            "fa-inverse",
            "fa-layers",
            "fa-layers-text",
            "fa-layers-counter",
          ]);
          if (!cls.startsWith("fa-")) return;
          if (STYLE_CLASSES.has(cls)) return;
          if (seen.has(cls)) return;
          seen.add(cls);
          icons.push({ cls, name: cls.replace(/^fa-/, "").replace(/-/g, " ") });
        }

        // FORMAT A & B: .fa-xxx::before or .fa-xxx:before with content value
        const reBefore =
          /\.(fa-[a-z0-9][a-z0-9-]*)::?before\s*\{[^}]*content\s*:\s*["\\]([^"';\n}]+)/gis;
        let m;
        while ((m = reBefore.exec(css)) !== null) add(m[1]);

        // FORMAT C: .fa-xxx { --fa: "..." }  or  .fa-xxx { --fa-icon: "..." }
        const reCustomProp =
          /\.(fa-[a-z0-9][a-z0-9-]*)\s*\{[^}]*--fa(?:-icon)?\s*:\s*["\\]([^"';\n}]+)/gis;
        while ((m = reCustomProp.exec(css)) !== null) add(m[1]);

        // FORMAT D: any rule block that contains a fa- class and a unicode content/var
        // Broader fallback — catches unusual whitespace/newline formatting
        const reGeneric =
          /\.(fa-[a-z0-9][a-z0-9-]*)\s*[,{][^{]*\{[^}]*(?:content|--fa)\s*:/gis;
        while ((m = reGeneric.exec(css)) !== null) add(m[1]);

        return icons;
      }

      // ─── DETECT FORMAT LABEL ─────────────────────────────────────────────────────
      function detectFormat(css) {
        if (/--fa(?:-icon)?\s*:/i.test(css))
          return "FA6-Kit (--fa custom prop)";
        if (/::before\s*\{[^}]*content\s*:/i.test(css)) return "FA6 (::before)";
        if (/:before\s*\{[^}]*content\s*:/i.test(css)) return "FA5 (:before)";
        return "Unknown";
      }

      // ─── RENDER CHECK ────────────────────────────────────────────────────────────
      // After fonts load, check if the ::before pseudo element has
      // (a) a content value that isn't none/empty AND
      // (b) a matching loaded @font-face
      function deepCheck(el) {
        if (!el) return false;
        const s = window.getComputedStyle(el, "::before");
        const c = s.content;
        if (
          !c ||
          c === "none" ||
          c === "normal" ||
          c === '""' ||
          c === "''" ||
          c === ""
        )
          return false;

        // Walk up to find effective font-family on the element
        let ff = "";
        let node = el;
        while (node && node !== document.documentElement) {
          ff = window.getComputedStyle(node).fontFamily || "";
          if (ff && ff !== "inherit") break;
          node = node.parentElement;
        }

        const loaded = [...document.fonts].filter((f) => f.status === "loaded");
        if (!loaded.length) return false;

        // See if any loaded font family matches what's applied
        return loaded.some((f) => {
          const fam = f.family.replace(/['"]/g, "").trim().toLowerCase();
          return (
            ff.toLowerCase().includes(fam) ||
            // FA6 sets font via CSS custom property -- font-family may resolve to
            // the actual name without the variable name being visible here
            fam.includes("font awesome") ||
            fam.includes("fa-")
          );
        });
      }

      // ─── FONT BANNER ─────────────────────────────────────────────────────────────
      function updateFontBanner() {
        const banner = document.getElementById("fbanner");
        const msg = document.getElementById("fbmsg");
        const ftags = document.getElementById("ftags");
        ftags.innerHTML = "";

        const loaded = [],
          failed = [],
          pending = [];
        const seen = new Set();
        document.fonts.forEach((f) => {
          const name = f.family.replace(/['"]/g, "").trim();
          if (seen.has(name)) return;
          seen.add(name);
          if (f.status === "loaded") loaded.push(name);
          else if (f.status === "error") failed.push(name);
          else pending.push(name);
        });

        const total = loaded.length + failed.length + pending.length;
        if (total === 0) {
          msg.textContent =
            "⚠ No @font-face fonts detected in the CSS files — icons cannot render";
          return;
        }

        if (failed.length) {
          msg.textContent = `⚠ ${failed.length} of ${total} webfont(s) failed to load`;
        } else if (pending.length) {
          msg.textContent = `⏳ ${loaded.length}/${total} webfonts loaded, ${pending.length} still loading…`;
        } else {
          banner.classList.add("ok");
          banner.querySelector(".pulse").style.animation = "none";
          msg.textContent = `✓ All ${loaded.length} webfont(s) loaded`;
        }

        [
          ...loaded.map((n) => ({ n, s: "ok" })),
          ...failed.map((n) => ({ n, s: "fail" })),
          ...pending.map((n) => ({ n, s: "" })),
        ].forEach(({ n, s }) => {
          const t = document.createElement("span");
          t.className = "ftag " + s;
          t.textContent = n;
          ftags.appendChild(t);
        });
      }

      // ─── AUDIT ───────────────────────────────────────────────────────────────────
      function auditGrid(container) {
        let ok = 0,
          fail = 0;
        container.querySelectorAll(".card").forEach((card) => {
          const i = card.querySelector(".prev i");
          if (deepCheck(i)) {
            ok++;
          } else {
            card.classList.add("broken");
            fail++;
          }
        });
        return { ok, fail };
      }

      // ─── CARDS ───────────────────────────────────────────────────────────────────
      function esc(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      function cardHtml(ic, style, q) {
        const cls = style + " " + ic.cls;
        const nm = q
          ? ic.name.replace(
              new RegExp("(" + esc(q) + ")", "gi"),
              "<mark>$1</mark>",
            )
          : ic.name;
        return `<div class="card" title="${cls}" onclick="cp(this,'${cls}')">
    <div class="pip"></div>
    <div class="prev"><i class="${cls}"></i></div>
    <div class="iname">${nm}</div>
  </div>`;
      }
      function cp(el, cls) {
        navigator.clipboard?.writeText(cls).catch(() => {});
        el.classList.add("done");
        setTimeout(() => el.classList.remove("done"), 850);
      }

      // ─── SEARCH ──────────────────────────────────────────────────────────────────
      const state = { cats: [], activeTab: "__all__", query: "" };
      let searchTimer;
      function doSearch(q) {
        state.query = q;
        const ar = document.getElementById("allres");
        const sw = document.getElementById("secwrap");
        if (!q.trim()) {
          ar.classList.remove("vis");
          sw.style.display = "";
          switchTab(state.activeTab);
          return;
        }
        ar.classList.add("vis");
        sw.style.display = "none";
        ar.innerHTML = "";
        let total = 0;
        state.cats.forEach((cat) => {
          if (cat.error || !cat.icons.length) return;
          const ql = q.toLowerCase();
          const matches = cat.icons.filter(
            (ic) => ic.cls.includes(ql) || ic.name.includes(ql),
          );
          if (!matches.length) return;
          total += matches.length;
          const lbl = document.createElement("div");
          lbl.className = "grplbl";
          lbl.textContent = `${cat.label} (${matches.length})`;
          ar.appendChild(lbl);
          const grid = document.createElement("div");
          grid.className = "igrid";
          grid.innerHTML = matches
            .map((ic) => cardHtml(ic, cat.style, q))
            .join("");
          ar.appendChild(grid);
          setTimeout(() => auditGrid(grid), 60);
        });
        if (!total)
          ar.innerHTML = `<div class="empty"><span>No icons match "<em style="color:var(--accent)">${q}</em>"</span></div>`;
      }

      // ─── TABS ─────────────────────────────────────────────────────────────────────
      function switchTab(id) {
        state.activeTab = id;
        document
          .querySelectorAll(".tab")
          .forEach((b) => b.classList.toggle("act", b.dataset.s === id));
        if (id === "__all__") {
          document
            .querySelectorAll(".sec")
            .forEach((s) => s.classList.add("vis"));
        } else {
          document
            .querySelectorAll(".sec")
            .forEach((s) => s.classList.toggle("vis", s.id === "sec-" + id));
        }
      }

      // ─── MAIN ─────────────────────────────────────────────────────────────────────
      async function init() {
        const sw = document.getElementById("secwrap");
        const tbar = document.getElementById("tbar");
        let totalIcons = 0;

        for (let i = 0; i < CATS.length; i++) {
          const c = CATS[i];
          document.getElementById("lmsg").textContent =
            `Parsing ${c.file} (${i + 1}/${CATS.length})…`;

          const cat = {
            ...c,
            icons: [],
            format: "–",
            loaded: false,
            error: null,
            cssSnippet: "",
          };

          try {
            const r = await fetch(c.file);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const css = await r.text();
            cat.icons = parseCss(css);
            cat.format = detectFormat(css);
            // Store first 600 chars for debug display (strip comments)
            cat.cssSnippet = css
              .replace(/\/\*[\s\S]*?\*\//g, "")
              .trim()
              .slice(0, 600);
            cat.loaded = true;
          } catch (e) {
            cat.error = e.message;
          }

          state.cats.push(cat);
          totalIcons += cat.icons.length;

          // ── Build section DOM ──
          const sec = document.createElement("div");
          sec.className = "sec";
          sec.id = "sec-" + cat.id;

          if (cat.error) {
            sec.innerHTML = `<div class="shead">
        <span class="stitle">${cat.label}</span>
        <span class="sfile">${cat.file}</span>
        <div class="ssum"><span class="badge fail">LOAD ERROR</span></div>
      </div>
      <div class="errc">✗ ${cat.error}<br>
        <small>Make sure this HTML file lives in the same folder as <code>css/</code> and <code>webfonts/</code></small>
      </div>`;
          } else if (!cat.icons.length) {
            // Show debug snippet so user can see the actual CSS format
            const snippetId = "snip-" + cat.id;
            sec.innerHTML = `<div class="shead">
        <span class="stitle">${cat.label}</span>
        <span class="sfile">${cat.file}</span>
        <span class="sfmt">${cat.format}</span>
        <div class="ssum"><span class="badge warn">0 icons parsed</span></div>
      </div>
      <div class="debugbox">
        <div class="dbhead" onclick="toggleSnip('${snippetId}')">
          ⚠ No icons found — click to inspect raw CSS (first 600 chars) and report the format
          <span style="font-size:10px;color:var(--dim)">▼ expand</span>
        </div>
        <pre class="dbpre" id="${snippetId}">${escHtml(cat.cssSnippet)}</pre>
      </div>`;
          } else {
            sec.innerHTML = `<div class="shead">
        <span class="stitle">${cat.label}</span>
        <span class="sfile">${cat.file}</span>
        <span class="sfmt">${cat.format}</span>
        <div class="ssum">
          <span class="badge ok" id="ok-${cat.id}">–</span>
          <span class="badge fail" id="fail-${cat.id}" style="display:none">–</span>
        </div>
      </div>
      <div class="igrid" id="grid-${cat.id}">${cat.icons.map((ic) => cardHtml(ic, cat.style, "")).join("")}</div>`;
          }
          sw.appendChild(sec);

          // Tab
          const btn = document.createElement("button");
          btn.className = "tab";
          btn.dataset.s = cat.id;
          btn.innerHTML = `${cat.label} <span class="n">${cat.error ? "!" : cat.icons.length}</span>`;
          btn.onclick = () => {
            state.query = "";
            document.getElementById("search").value = "";
            document.getElementById("allres").classList.remove("vis");
            document.getElementById("secwrap").style.display = "";
            switchTab(cat.id);
          };
          tbar.appendChild(btn);
        }

        document.getElementById("cnt-all").textContent = totalIcons;
        document.getElementById("loading").style.display = "none";

        document.querySelector('[data-s="__all__"]').onclick = () => {
          state.query = "";
          document.getElementById("search").value = "";
          document.getElementById("allres").classList.remove("vis");
          document.getElementById("secwrap").style.display = "";
          switchTab("__all__");
        };

        const first =
          state.cats.find((c) => !c.error && c.icons.length) || state.cats[0];
        if (first) switchTab(first.id);

        updateFontBanner();

        // ── Wait for fonts, then audit ──
        document.fonts.ready.then(() => {
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              updateFontBanner();

              let totalOk = 0,
                totalFail = 0;
              const agrid = document.getElementById("agrid");
              agrid.innerHTML = "";

              state.cats.forEach((cat) => {
                const row = document.createElement("div");
                row.className = "arow";
                if (cat.error) {
                  row.innerHTML = `<span class="aname">${cat.label}</span><div class="apills"><span class="badge fail">ERROR</span></div>`;
                } else if (!cat.icons.length) {
                  row.innerHTML = `<span class="aname">${cat.label}</span><span class="afmt">${cat.format}</span><div class="apills"><span class="badge warn">0 parsed</span></div>`;
                } else {
                  const grid = document.getElementById("grid-" + cat.id);
                  const { ok, fail } = grid
                    ? auditGrid(grid)
                    : { ok: 0, fail: cat.icons.length };
                  totalOk += ok;
                  totalFail += fail;
                  const okB = document.getElementById("ok-" + cat.id);
                  const failB = document.getElementById("fail-" + cat.id);
                  if (okB) okB.textContent = `${ok} ✓`;
                  if (failB && fail > 0) {
                    failB.textContent = `${fail} ✗`;
                    failB.style.display = "";
                  }
                  row.innerHTML = `<span class="aname" title="${cat.file}">${cat.label}</span>
            <span class="afmt">${cat.format}</span>
            <div class="apills">
              ${ok > 0 ? `<span class="badge ok">${ok}✓</span>` : ""}
              ${fail > 0 ? `<span class="badge fail">${fail}✗</span>` : ""}
              ${ok === 0 && fail === 0 ? `<span class="badge warn">?</span>` : ""}
            </div>`;
                }
                agrid.appendChild(row);
              });

              document.getElementById("tok").textContent = totalOk;
              document.getElementById("tfail").textContent = totalFail;
              document.getElementById("analysis").style.display = "";
            }),
          );
        });

        document.getElementById("search").addEventListener("input", (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 180);
        });
      }

      function toggleSnip(id) {
        const el = document.getElementById(id);
        el.classList.toggle("open");
      }

      function escHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      init();
    </script>
  </body>
</html>
